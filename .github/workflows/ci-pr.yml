name: Mobile CI — PR vers dev

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    name: Lint, TypeScript, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le lint
        run: npm run lint

      - name: Vérifier TypeScript
        run: npx tsc --noEmit

      - name: Exécuter les tests
        run: npm test

      - name: Vérifier le build Expo Android (bundle JS)
        run: npx expo export --platform android --output-dir dist
