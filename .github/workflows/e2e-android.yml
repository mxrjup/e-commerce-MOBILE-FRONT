name: Mobile Android E2E

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    name: Android E2E (Maestro)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build standalone E2E APK locally (bundled JS, no Metro/EAS)
        run: npm run e2e:build
      - name: Start isolated backend and verify fixtures
        run: npm run e2e:backend -- up
      - name: Install pinned Maestro CLI
        run: |
          curl --fail --location --retry 3 https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip -o "$RUNNER_TEMP/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-cli"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute all four UI flows on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: npm run test:e2e
      - name: Collect backend logs
        if: always()
        run: npm run e2e:backend -- logs
      - name: Upload reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-${{ github.run_attempt }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove isolated containers and volumes
        if: always()
        run: npm run e2e:backend -- down
