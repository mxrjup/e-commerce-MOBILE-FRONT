name: Mobile Web E2E
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-web-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  playwright:
    name: Playwright E2E (web mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:backend -- up
      - run: npm run test:e2e
      - name: Backend logs
        if: always()
        run: npm run e2e:backend -- logs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: artifacts/e2e/
          retention-days: 14
      - name: Stop isolated backend
        if: always()
        run: npm run e2e:backend -- down
